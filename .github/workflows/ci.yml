name: AI Weekly Reads Health

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1"

permissions:
  contents: read

jobs:
  health:
    name: Repo health
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The health scripts run on a bare interpreter; this step exists to
      # catch requirement pins that no longer resolve.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python scripts
        run: find scripts -name '*.py' -print0 | xargs -0 python -m py_compile

      - name: Check repo health
        run: python scripts/check_repo_health.py

      - name: Audit knowledge-base shape
        run: python scripts/audit_knowledge_base.py

      - name: Smoke test source usage ledger
        run: |
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/02_sources/theology" "$tmpdir/output/_metadata"
          touch "$tmpdir/02_sources/theology/part-1.md" "$tmpdir/02_sources/tech.md"
          python scripts/source_usage.py add \
            --ledger "$tmpdir/output/_metadata/source_usage.json" \
            --issue-id theology-2026-07-01 \
            --kind daily \
            --lane theology \
            --title "Theology part 1" \
            --published 2026-07-01 \
            --output daily/2026-07-01-theology.md \
            --source 02_sources/theology/part-1.md
          python scripts/source_usage.py context \
            --ledger "$tmpdir/output/_metadata/source_usage.json" \
            --lane theology \
            --source-root "$tmpdir/02_sources" \
            --limit 5

      - name: Smoke test OpenCode writer wrapper
        run: |
          python scripts/run_opencode_writer.py \
            --dry-run \
            --issue-id theology-2026-07-01 \
            --kind daily \
            --lane theology \
            --title "Theology part 1" \
            --published 2026-07-01 \
            --output 99_meta/tools/ai-weekly-reads/daily/2026-07-01-theology.md \
            --source 02_sources/theology/part-1.md

      - name: Test Rust continuity helper
        run: cargo test --manifest-path tools/continuity/Cargo.toml
